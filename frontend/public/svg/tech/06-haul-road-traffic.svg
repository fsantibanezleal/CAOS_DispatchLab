<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" class="arch-svg" role="img" aria-label="The haul-road network and traffic model: portal, shared trunk, junction, curved spurs to crusher, waste dump and stockpile, with car-following bunching, a posted speed limit and a two-way meeting slowdown">
  <!-- Hand-authored. Every colour is a shell CSS variable, so the diagram repaints
       with the active light/dark theme when inlined into the SPA (ADR-0058). -->
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); font-size: 13px; }
    .arch-svg .sm { font-size: 11px; fill: var(--color-fg-subtle); }
    .arch-svg .lbl { fill: var(--color-fg); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .pit { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .road { fill: none; stroke: var(--color-fg-subtle); stroke-width: 7; stroke-linecap: round; opacity: 0.5; }
    .arch-svg .trunk { stroke-width: 9; }
    .arch-svg .loaded { fill: var(--color-warning, #d29922); }
    .arch-svg .empty { fill: var(--color-accent); }
    .arch-svg .node { fill: var(--color-accent); }
    .arch-svg .dash { stroke: var(--color-fg); stroke-dasharray: 4 3; stroke-width: 1; }
    .arch-svg .rule { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1; }
  </style>

  <!-- pit with shovels -->
  <ellipse cx="130" cy="240" rx="105" ry="150" class="pit" />
  <text x="130" y="115" text-anchor="middle" class="sm">open pit</text>
  <g class="loaded">
    <rect x="95" y="170" width="20" height="13" rx="2" /><rect x="150" y="205" width="20" height="13" rx="2" />
    <rect x="100" y="285" width="20" height="13" rx="2" /><rect x="145" y="315" width="20" height="13" rx="2" />
  </g>
  <text x="130" y="405" text-anchor="middle" class="sm">shovels (ore + waste faces)</text>

  <!-- portal -->
  <circle cx="250" cy="240" r="14" class="node" />
  <text x="250" y="212" text-anchor="middle" class="lbl">portal</text>
  <text x="250" y="272" text-anchor="middle" class="sm">pit exit</text>

  <!-- trunk portal -> junction -->
  <path class="road trunk" d="M 264 240 Q 380 218 470 240" />
  <circle cx="470" cy="240" r="9" class="node" />
  <text x="470" y="272" text-anchor="middle" class="sm">junction</text>

  <!-- curved spurs junction -> destinations -->
  <path class="road" d="M 478 234 Q 610 150 735 120" />
  <path class="road" d="M 480 240 Q 620 245 745 250" />
  <path class="road" d="M 478 247 Q 610 340 735 372" />

  <!-- destinations -->
  <g>
    <rect x="735" y="100" width="120" height="40" rx="6" class="bx" /><text x="795" y="124" text-anchor="middle" class="lbl">crusher / plant</text>
    <rect x="745" y="230" width="110" height="40" rx="6" class="bx" /><text x="800" y="254" text-anchor="middle" class="lbl">stockpile</text>
    <rect x="735" y="352" width="120" height="40" rx="6" class="bx" /><text x="795" y="376" text-anchor="middle" class="lbl">waste dump</text>
  </g>

  <!-- bunched platoon on the trunk (loaded, same direction) + headway h -->
  <g class="loaded">
    <rect x="330" y="215" width="18" height="12" rx="2" /><rect x="360" y="212" width="18" height="12" rx="2" /><rect x="390" y="210" width="18" height="12" rx="2" />
  </g>
  <line x1="348" y1="235" x2="378" y2="232" class="dash" />
  <text x="363" y="250" text-anchor="middle" class="sm">h</text>
  <text x="360" y="196" text-anchor="middle" class="sm">bunched platoon (no overtaking)</text>

  <!-- an opposing empty truck (meeting) -->
  <rect x="415" y="252" width="18" height="12" rx="2" class="empty" />
  <text x="424" y="284" text-anchor="middle" class="sm">empty return</text>

  <!-- the three rules -->
  <g>
    <rect x="300" y="330" width="560" height="120" rx="8" class="rule" />
    <text x="318" y="356" class="lbl">Travel time EMERGES from traffic (per directed road):</text>
    <text x="330" y="382" class="sm">1 · SPEED LIMIT, no truck exceeds the posted road speed, however capable its rimpull.</text>
    <text x="330" y="404" class="sm">2 · CAR-FOLLOWING, FIFO + security-distance headway h, a fast truck is held behind a slow one (bunching).</text>
    <text x="330" y="426" class="sm">3 · TWO-WAY MEETING, a passing-bay slowdown when meeting opposing traffic on a single lane.</text>
  </g>
  <text x="580" y="470" text-anchor="middle" class="sm">Full fidelity (direction zones, per-section capacity) lives in minehaulsim; app renders its roads/v1.</text>
</svg>
