<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" class="arch-svg" role="img" aria-label="DispatchLab science — discrete-event simulation, match factor, policy comparison, the learned policies">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); }
    .arch-svg .bx-good { stroke: var(--color-good); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .st { fill: var(--color-accent); font-size: 11px; font-weight: 700; }
    .arch-svg .it { fill: var(--color-fg); font-size: 10.5px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9px; }
    .arch-svg .eq { fill: var(--color-fg); font-size: 12.5px; }
    .arch-svg .eqi { fill: var(--color-fg); font-size: 12.5px; font-style: italic; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="sc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="28">The science — a discrete-event haulage simulation + dispatch policies</text>
  <text class="sub" x="22" y="45">frontend/src/sim/ + policies/ · the same TypeScript runs live in the browser and under Node in the offline bake</text>

  <!-- Stage 1 -->
  <rect class="bx bx-hi" x="16" y="66" width="170" height="104" rx="9"/>
  <text class="st" x="28" y="88">① Event queue</text>
  <text class="it" x="28" y="108">min-heap DES clock</text>
  <text class="mu" x="28" y="124">load / haul / dump /</text>
  <text class="mu" x="28" y="138">return events</text>
  <text class="cd mono" x="28" y="160">des.ts · heap.ts</text>

  <!-- Stage 2 -->
  <rect class="bx bx-hi" x="202" y="66" width="170" height="104" rx="9"/>
  <text class="st" x="214" y="88">② Kinematics</text>
  <text class="it" x="214" y="108">speed(grade, RR, load)</text>
  <text class="mu" x="214" y="124">travel time per segment</text>
  <text class="mu" x="214" y="138">+ shovel load cycle</text>
  <text class="cd mono" x="214" y="160">kinematics.ts</text>

  <!-- Stage 3 -->
  <rect class="bx bx-hi" x="388" y="66" width="170" height="104" rx="9"/>
  <text class="st" x="400" y="88">③ Dispatch decision</text>
  <text class="it" x="400" y="108">at each truck-free event</text>
  <text class="mu" x="400" y="124">pick a shovel by the</text>
  <text class="mu" x="400" y="138">policy (heuristic / NN)</text>
  <text class="cd mono" x="400" y="160">policies/heuristics · learned</text>

  <!-- Stage 4 -->
  <rect class="bx bx-hi" x="574" y="66" width="170" height="104" rx="9"/>
  <text class="st" x="586" y="88">④ KPIs + compare</text>
  <text class="it" x="586" y="108">tons, MF, truck-wait</text>
  <text class="mu" x="586" y="124">many seeds → Pareto</text>
  <text class="mu" x="586" y="138">front + tie test</text>
  <text class="cd mono" x="586" y="160">compare.ts · sweep.ts</text>

  <!-- Stage 5 -->
  <rect class="bx bx-good" x="760" y="66" width="124" height="104" rx="9"/>
  <text class="st" x="772" y="88" style="fill:var(--color-good)">⑤ Verdict</text>
  <text class="it" x="772" y="108">best policy</text>
  <text class="mu" x="772" y="124">throughput vs wait</text>
  <text class="cd mono" x="772" y="148">paretoFront</text>

  <path class="flow" d="M186,118 H200" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M372,118 H386" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M558,118 H572" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M744,118 H758" marker-end="url(#sc-arrow)"/>

  <!-- equations -->
  <rect class="bx" x="16" y="190" width="430" height="120" rx="9"/>
  <text class="it" x="30" y="212" style="font-weight:700">Match factor (fleet ↔ shovel balance)</text>
  <text class="eqi" x="30" y="240">MF = (n_trucks · t_shovel) / (n_shovels · t_truckcycle)</text>
  <text class="eq" x="30" y="266">MF &lt; 1 under-trucked · MF &gt; 1 over-trucked</text>
  <text class="mu" x="30" y="292">the analytical anchor (Morgan/Peterson); the DES recovers it for the balanced cases (a correctness check).</text>

  <rect class="bx" x="454" y="190" width="430" height="120" rx="9"/>
  <text class="it" x="468" y="212" style="font-weight:700">Discrete-event simulation</text>
  <text class="eqi" x="468" y="240">advance to the next event; update state; re-dispatch</text>
  <text class="eq" x="468" y="266">throughput = Σ payload / shift   ·   wait = Σ queue time</text>
  <text class="mu" x="468" y="292">exact event-driven dynamics (no fixed time step); centisecond clock; seeded for byte-identical replay.</text>

  <!-- learned lane -->
  <rect class="bx" x="16" y="330" width="430" height="124" rx="9"/>
  <text class="it" x="30" y="352" style="font-weight:700">Deterministic engine (always on)</text>
  <text class="mu" x="30" y="374">the transparent DES + the heuristic policies</text>
  <text class="mu" x="30" y="392">(greedy, min-wait, …) — the reference every</text>
  <text class="mu" x="30" y="410">learned policy is measured against; live.</text>
  <text class="cd mono" x="30" y="436">sim/des.ts · policies/heuristics.ts (live)</text>

  <rect class="bx bx-good" x="454" y="330" width="430" height="124" rx="9"/>
  <text class="it" x="468" y="352" style="font-weight:700">Learned lane (ONNX, client-side)</text>
  <text class="mu" x="468" y="374">• dl-policy: shovel features → score (a learned</text>
  <text class="mu" x="468" y="392">  dispatch policy), reported by imitation accuracy.</text>
  <text class="mu" x="468" y="410">• dl-bcbest: behaviour-clone of the best heuristic.</text>
  <text class="cd mono" x="468" y="436">train.py → dl-policy.onnx · dl-bcbest.onnx → ort.ts</text>
</svg>
