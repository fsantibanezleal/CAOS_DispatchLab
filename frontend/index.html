<html lang="en" data-theme="dark">

    <title>DispatchLab, Truck-Shovel Dispatch Policy Bench (open-pit DES)</title>
    <meta name="description" content="A real, in-browser bench that compares truck-to-shovel dispatch policies, greedy, shortest-wait, the classic criteria, Hungarian joint assignment and two learned imitation policies (ONNX), on a deterministic discrete-event open-pit simulation, validated against closed-form match-factor theory and a 1×1 capacity oracle. A policy-comparison sandbox, not a production dispatch system. Part of the Faena mining-analytics hub." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Pre-paint theme, same localStorage key as the shared shell.
      (function () {
        try {
          var s = localStorage.getItem('caos.theme');
          document.documentElement.dataset.theme = s ? s : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
